server {

    # TODO: Listen on port 80
    # Hint: listen 80;
    listen 80;

    server_name localhost;

    # TODO: Set the root to where Nginx serves your files
    # Hint: root /usr/share/nginx/html;
    root /usr/share/nginx/html;

    index index.html;

    # SPA Fallback - serves index.html for all routes so React Router works
    location / {
        # TODO: Fill in the three try_files arguments
        # Hint: try_files $uri $uri/ /index.html;
        try_files $uri $uri/ /index.html;
    }

    # TODO: Enable gzip compression
    # Hint: gzip on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

}